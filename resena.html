<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tu reseña | Impact Garage</title><style>body{background:#090909;color:white;font:16px Arial;padding:30px}main{max-width:500px;margin:50px auto;background:#191919;padding:30px;border-radius:18px}input,textarea,select,button{width:100%;box-sizing:border-box;padding:14px;margin:10px 0;background:#292929;color:white;border:1px solid #555;border-radius:8px}button{background:#e21b24;font-weight:bold;cursor:pointer}label{display:block;margin-top:15px}</style></head><body><main><h1>Cuéntanos tu experiencia</h1><p>Tu reseña se publicará después de ser revisada.</p><form id="form"><label>Tu nombre<input name="customer_name" maxlength="90" required></label><label>Calificación<select name="rating" required><option value="5">★★★★★ 5 estrellas</option><option value="4">★★★★ 4 estrellas</option><option value="3">★★★ 3 estrellas</option><option value="2">★★ 2 estrellas</option><option value="1">★ 1 estrella</option></select></label><label>Tu reseña<textarea name="comment" minlength="10" maxlength="1200" rows="5" required></textarea></label><button>Enviar reseña</button></form><p id="msg"></p></main><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const f=e.target;const data=Object.fromEntries(new FormData(f));data.token=new URLSearchParams(location.search).get('token');const r=await fetch('/api/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();document.getElementById('msg').textContent=r.ok?'¡Gracias! Tu reseña quedó pendiente de aprobación.':(d.error||'Error al guardar');if(r.ok)f.remove()};</script></body></html>
